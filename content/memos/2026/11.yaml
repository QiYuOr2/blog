  type: text
  link:
    title: 丰饶之海（第四卷）：天人五衰
    href: https://weread.qq.com/book-detail?type=1&v=a28326e0721e0c38a2890b6
    cover: https://wfqqreader-1252317822.image.myqcloud.com/cover/640/35523640/t6_35523640.jpg
    description: >-
      《丰饶之海》的最后一部。本多繁邦已经七十八岁，本多又在安永透身上看到了那三颗黑痣，认定他是这一系列轮回的产物，他将安永透收留成为养子。四年后，阿透考上东京帝国大学后，开始虐待本多，稍有不如意本多就遭到毒打。阿透将原本住在清水的疯女绢江接过来照顾，在疯女面前，阿透流露出甜蜜的温柔。本多因为窥视的丑闻遭杂志报道，留下与绢江结婚的阿透，独自来到六十一年未去的月修寺。
  content:
    - "从大学时期我就在断断续续地读丰饶之海系列，如今终于看完了，无论如何我也无法想到丰饶之海的最后走向了虚无。本多六十年的追寻、三位轮回之人的一生都被轻描淡写地击溃，好像这也是必然。三岛递交手稿时的心情我无法揣摩，但此刻我的内心就和丰饶之海一样是无比空虚的。"
